name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 允许在网页上手动触发。
  # 加上它之后，仓库的 Actions 页面会出现一个 Run workflow 按钮，
  # 不用推代码也能重新构建部署 —— 改完 Pages 设置、或者怀疑构建缓存有问题时很有用。
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
